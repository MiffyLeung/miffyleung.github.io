<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#faf9f6" />
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
    <style id="route-motion">@view-transition{navigation:auto}</style>
    <script>for(const type of ["pageswap","pagereveal"])addEventListener(type,event=>{if(event.viewTransition)for(const key of ["ready","finished","updateCallbackDone"])event.viewTransition[key].catch(()=>{})});try{if(matchMedia('(prefers-reduced-motion: reduce)').matches||localStorage.getItem('portfolio-motion')==='off'){document.documentElement.dataset.motion='off';document.getElementById('route-motion').textContent='@view-transition{navigation:none}'}}catch(_){}</script>
    <title>Miffy Leung — Portfolio</title>
  </head>
  <body class="routed-page home-page">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
